name: Test and build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar CHDMAN oficial para teste de conversão real
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mame-tools
      - run: python -m unittest discover -s tests -v
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --noconsole --name CHDPS1 chdps1.py
      - run: pyinstaller --noconfirm --clean --onefile --console --name CHDPS1-CLI chdps1.py
      - name: Pacote para Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/CHDPS1.exe,dist/CHDPS1-CLI.exe,README.md release/
          Compress-Archive -Path release/* -DestinationPath CHDPS1-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CHDPS1-Windows
          path: CHDPS1-Windows.zip